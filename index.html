<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉方库</title>


<style>

body {

    font-family: Arial, sans-serif;

    max-width: 800px;

    margin: auto;

    padding: 20px;

    background: #f5f2eb;

}


h1 {

    text-align: center;

    color: #5c4033;

}


.search {

    width: 100%;

    padding: 12px;

    font-size: 16px;

    border-radius: 8px;

    border: 1px solid #ccc;

    box-sizing: border-box;

}



#categories {

    margin-top:20px;

}



button {

    padding:8px 15px;

    margin:5px;

    border:none;

    border-radius:20px;

    background:#8b6f47;

    color:white;

    cursor:pointer;

}



.card {

    background:white;

    margin-top:20px;

    padding:20px;

    border-radius:12px;

}



.name {

    font-size:22px;

    font-weight:bold;

}



.name a {

    color:#5c4033;

    text-decoration:none;

}



.info {

    margin-top:10px;

    line-height:1.8;

}



</style>


</head>



<body>


<h1>
守艺人 · 釉方库
</h1>



<input

class="search"

id="search"

placeholder="搜索釉名，例如：青釉"

/>



<div id="categories"></div>



<div id="list"></div>



<script>


let glazes=[];



// 加载釉方数据

fetch("glazes.json")

.then(response=>response.json())

.then(data=>{


    glazes=data;


    showCategories();


    showGlazes(glazes);


});





// 显示分类按钮

function showCategories(){


    let categories=[

        "全部",

        ...new Set(

            glazes.map(

                item=>item.category

            )

        )

    ];



    let html="";



    categories.forEach(category=>{


        html += `

        <button onclick="filterCategory('${category}')">

        ${category}

        </button>

        `;


    });



    document

    .getElementById("categories")

    .innerHTML=html;


}




// 分类筛选

function filterCategory(category){



    if(category==="全部"){


        showGlazes(glazes);


        return;


    }



    let result = glazes.filter(

        item=>item.category===category

    );



    showGlazes(result);



}




// 显示釉方列表

function showGlazes(data){


    let html="";



    data.forEach(item=>{


        html += `


        <div class="card">


        <div class="name">


        <a href="detail.html?id=${item.id}">

        ${item.name}

        </a>


        </div>



        <div class="info">


        分类：

        ${item.category}

        <br>


        温度：

        ${item.temperature}


        <br>


        气氛：

        ${item.atmosphere}


        </div>


        </div>


        `;


    });



    document

    .getElementById("list")

    .innerHTML=html;



}




// 搜索


document

.getElementById("search")

.addEventListener(

"input",

function(){



    let keyword=this.value;



    let result=glazes.filter(item=>


        item.name.includes(keyword)

        ||

        item.category.includes(keyword)

        ||

        item.atmosphere.includes(keyword)


    );



    showGlazes(result);



}

);



</script>


</body>


</html>
