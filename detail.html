<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉方详情</title>


<style>

body {

    font-family: Arial, sans-serif;

    max-width:800px;

    margin:auto;

    padding:20px;

    background:#f5f2eb;

}


.back {

    margin-bottom:20px;

}


.back a {

    color:#5c4033;

    text-decoration:none;

}



.card {

    background:white;

    padding:25px;

    border-radius:12px;

}



h1 {

    color:#5c4033;

}



.section {

    margin-top:25px;

}



.section h3 {

    border-bottom:1px solid #ddd;

    padding-bottom:5px;

}



.info {

    line-height:1.9;

}



.ingredient {

    display:flex;

    justify-content:space-between;

    background:#f7f5f0;

    padding:8px;

    margin:5px 0;

    border-radius:5px;

}



.tag {

    display:inline-block;

    background:#8b6f47;

    color:white;

    padding:5px 12px;

    border-radius:15px;

    margin-right:5px;

}



</style>


</head>


<body>


<div class="back">

<a href="index.html">
← 返回釉库
</a>

</div>



<div id="content"></div>




<script>


let id =

new URLSearchParams(

window.location.search

).get("id");




fetch("glazes.json")

.then(res=>res.json())

.then(data=>{


let glaze =

data.find(

item=>item.id==id

);



if(!glaze){

document.getElementById("content").innerHTML=

"没有找到该釉方";

return;

}



let ingredients="";



glaze.ingredients.forEach(item=>{


ingredients += `

<div class="ingredient">

<span>
${item.material}
</span>

<span>
${item.ratio}
</span>

</div>

`;


});




let aliases="";



if(glaze.alias){


glaze.alias.forEach(item=>{


aliases +=

`

<span class="tag">

${item}

</span>

`;


});


}




document

.getElementById("content")

.innerHTML=

`


<div class="card">


<h1>

${glaze.name}

</h1>



<div>

${aliases}

</div>




<div class="section info">


分类：

${glaze.category}

<br>


颜色：

${glaze.color}

<br>


釉面：

${glaze.surface}

<br>


烧成温度：

${glaze.temperature}

<br>


烧成气氛：

${glaze.atmosphere}


</div>





<div class="section">


<h3>

适用泥料

</h3>


<div class="info">

${glaze.clay}

</div>


</div>






<div class="section">


<h3>

配方

</h3>


${ingredients}


</div>






<div class="section">


<h3>

制作流程

</h3>


<div class="info">

${glaze.process}

</div>


</div>






<div class="section">


<h3>

注意事项

</h3>


<div class="info">

${glaze.notes}

</div>


</div>






<div class="section">


<h3>

资料来源

</h3>


<div class="info">

${glaze.source}

</div>


</div>



</div>


`;



});



</script>



</body>

</html>
