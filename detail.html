<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>釉方详情 · 守艺人</title>
<style>
:root {
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #5c4033;
    --text-light: #8b7e6e;
    --text-muted: #a89a8a;
    --primary: #8b6f47;
    --primary-hover: #7a6240;
    --border: #e8e0d8;
    --border-light: #f0ebe3;
    --success: #2e7d32;
    --warn: #e65100;
    --shadow: 0 1px 4px rgba(92,64,51,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
}

nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    position: sticky;
    top: 0;
    z-index: 100;
}
.nav-inner {
    max-width: 900px; margin: 0 auto;
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
}
.logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
}
.logo-icon {
    width: 36px; height: 36px;
    background: var(--primary); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: bold;
}
.logo-text {
    font-size: 20px; font-weight: 700;
    color: var(--text); letter-spacing: 2px;
}
.nav-links {
    display: flex; gap: 28px;
}
.nav-links a {
    font-size: 14px; color: var(--text-light);
    text-decoration: none; padding-bottom: 2px;
    transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
    color: var(--primary);
    border-bottom: 2px solid var(--primary);
}

.back-bar {
    max-width: 900px; margin: 0 auto;
    padding: 16px 20px;
}
.back-bar a {
    font-size: 13px; color: var(--primary);
    text-decoration: none;
}
.back-bar a:hover { text-decoration: underline; }

.detail-grid {
    max-width: 900px; margin: 0 auto;
    padding: 0 20px 24px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
}
@media (max-width: 768px) {
    .detail-grid { grid-template-columns: 1fr; }
}

.card {
    background: var(--card);
    border-radius: 14px; padding: 24px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
}
.card h3 {
    font-size: 15px; color: var(--text);
    margin: 0 0 14px;
}

.detail-header {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 4px;
}
.detail-img {
    width: 100px; height: 100px;
    border-radius: 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}
.detail-img .shine {
    position: absolute; inset: 0;
    pointer-events: none;
}
.detail-title {
    font-size: 22px; font-weight: 700;
    color: var(--text); margin: 0 0 8px;
}
.detail-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 8px;
}
.tag {
    font-size: 11px; padding: 2px 10px;
    border-radius: 10px; font-weight: 500;
}
.tag-cat { background: #e8f0e4; color: #4a7c3f; }
.tag-atm { background: var(--border-light); color: var(--primary); }
.tag-usage {
    background: var(--border-light); color: var(--primary);
    font-size: 11px; padding: 2px 10px;
    border-radius: 10px;
}
.detail-meta {
    font-size: 13px; color: var(--text-light);
    line-height: 1.8;
}

.seger-box {
    background: var(--bg);
    border-left: 3px solid var(--primary);
    padding: 14px 18px;
    border-radius: 0 10px 10px 0;
    font-family: "Courier New", "Consolas", monospace;
    font-size: 14px; line-height: 2.2;
    color: var(--text);
}

.metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
}
.metric-item {
    background: var(--border-light);
    padding: 10px; border-radius: 8px;
    text-align: center;
}
.metric-value {
    font-size: 18px; font-weight: 700;
    color: var(--text);
}
.metric-label {
    font-size: 11px; color: var(--text-muted);
    margin-top: 2px;
}

.ingredient {
    display: flex; justify-content: space-between;
    background: var(--bg); padding: 8px;
    margin: 5px 0; border-radius: 6px;
    font-size: 13px;
}

.note-box {
    background: #fff3e0;
    border-left: 3px solid #ff9800;
    padding: 12px 16px;
    margin: 10px 0;
    border-radius: 0 8px 8px 0;
    font-size: 12px; color: var(--warn);
}
.note-box.ok {
    background: #e8f5e9;
    border-left-color: var(--success);
    color: var(--success);
}
.note-box.info {
    background: #e3f2fd;
    border-left-color: #2196f3;
    color: #1565c0;
}

.info-text {
    font-size: 13px; color: var(--text);
    line-height: 1.9;
}
.info-text strong {
    color: var(--text);
    display: inline-block;
    min-width: 60px;
}

.sidebar-card {
    background: var(--card);
    border-radius: 14px; padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
}
.sidebar-card h3 {
    font-size: 14px; color: var(--text);
    margin: 0 0 12px;
}

.pred-tags {
    display: flex; flex-direction: column; gap: 6px;
}
.pred-tag {
    padding: 6px 12px;
    background: var(--primary); color: #fff;
    border-radius: 12px; font-size: 12px;
    text-align: center;
}
.pred-tag.secondary { background: #a1887f; }

.limit-item {
    display: flex; justify-content: space-between;
    align-items: center; padding: 6px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
}
.limit-item:last-child { border-bottom: none; }
.limit-pass { color: var(--success); font-weight: 600; }
.limit-warn { color: var(--warn); font-weight: 600; }

.similar-item {
    padding: 10px;
    background: var(--bg); border-radius: 8px;
    cursor: pointer; border: 1px solid var(--border);
    margin-bottom: 8px; transition: all 0.2s;
    text-decoration: none; color: inherit;
    display: block;
}
.similar-item:hover {
    border-color: var(--primary);
    background: var(--border-light);
}
.similar-name {
    font-size: 13px; font-weight: 600;
    color: var(--text);
}
.similar-meta {
    font-size: 11px; color: var(--text-muted);
    margin-top: 2px;
}

.action-btn {
    display: block; width: 100%;
    padding: 12px; margin-bottom: 8px;
    border-radius: 10px; font-size: 14px;
    cursor: pointer; text-align: center;
    border: none; transition: all 0.2s;
}
.action-btn.primary {
    background: var(--primary); color: #fff;
}
.action-btn.primary:hover { background: var(--primary-hover); }
.action-btn.secondary {
    background: var(--border-light);
    border: 1px solid #c4b8a8;
    color: var(--text);
}
.action-btn.secondary:hover { background: #e8ddd0; }

.source-note {
    font-size: 11px; color: var(--text-muted);
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border-light);
}

footer {
    padding: 24px; text-align: center;
    border-top: 1px solid var(--border);
    margin-top: 20px;
}
footer p { font-size: 12px; color: #c4b8a8; }

@media (max-width: 600px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 13px; }
    .detail-header { flex-direction: column; }
    .detail-img { width: 80px; height: 80px; }
    .metric-grid { grid-template-columns: 1fr 1fr; }
}
</style>

<script>
let glazes = [];
let materials = [];
let id = new URLSearchParams(window.location.search).get("id");

function fetchWithTimeout(url, timeout = 5000) {
    return Promise.race([
        fetch(url),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), timeout))
    ]);
}

async function loadData() {
    // 加载釉方数据
    try {
        const res = await fetchWithTimeout("glazes_glazy_preview.json", 8000);
        if (res.ok) glazes = await res.json();
    } catch (e) {
        try {
            const res = await fetchWithTimeout("glazes.json", 5000);
            if (res.ok) glazes = await res.json();
        } catch (e2) {}
    }
    
    // 加载原料数据
    try {
        const res = await fetchWithTimeout("materials.json", 5000);
        if (res.ok) materials = await res.json();
    } catch (e) {
        console.log("原料数据加载失败:", e.message);
    }
    
    renderDetail();
}

loadData();

// ========== 塞格尔式反推原料配比算法 ==========

const OXIDE_MW = {
    K2O: 94.20, Na2O: 61.98, Li2O: 29.88, CaO: 56.08, MgO: 40.30,
    ZnO: 81.38, BaO: 153.33, SrO: 103.62, Al2O3: 101.96, B2O3: 69.62,
    SiO2: 60.08, TiO2: 79.87, P2O5: 141.94, Fe2O3: 159.69,
    CoO: 74.93, CuO: 79.55, MnO2: 86.94, Cr2O3: 151.99, NiO: 74.69
};

// 塞格尔式 → 氧化物重量百分比（烧后）
function segerToOxideWt(seger) {
    let oxides = {};
    let total = 0;
    for (let ox in seger) {
        if (OXIDE_MW[ox]) {
            oxides[ox] = seger[ox] * OXIDE_MW[ox];
            total += oxides[ox];
        }
    }
    for (let ox in oxides) {
        oxides[ox] = oxides[ox] / total * 100;
    }
    return oxides;
}

// 非负最小二乘（坐标下降法）
function nnls(A, b, maxIter, tol) {
    maxIter = maxIter || 2000;
    tol = tol || 1e-6;
    let m = A.length;
    let n = A[0].length;
    let x = new Array(n).fill(0);
    
    for (let iter = 0; iter < maxIter; iter++) {
        let maxChange = 0;
        for (let j = 0; j < n; j++) {
            let residual = b.slice();
            for (let i = 0; i < m; i++) {
                for (let k = 0; k < n; k++) {
                    if (k !== j) residual[i] -= A[i][k] * x[k];
                }
            }
            let num = 0, den = 0;
            for (let i = 0; i < m; i++) {
                num += A[i][j] * residual[i];
                den += A[i][j] * A[i][j];
            }
            let newX = den > 1e-10 ? num / den : 0;
            if (newX < 0) newX = 0;
            maxChange = Math.max(maxChange, Math.abs(newX - x[j]));
            x[j] = newX;
        }
        if (maxChange < tol) break;
    }
    return x;
}

// 反推原料配比
function reverseRecipe(segerFormula) {
    if (!materials || materials.length === 0) return null;
    
    // 1. 目标氧化物重量百分比
    let target = segerToOxideWt(segerFormula);
    let oxideNames = Object.keys(target);
    
    // 2. 准备原料（烧后基准）
    let matList = materials.map(function(m) {
        let loi = m.LOI || 0;
        let factor = 100 / (100 - loi);
        let burned = {};
        for (let ox in m.analysis) {
            if (target[ox] !== undefined) {
                burned[ox] = m.analysis[ox] * factor;
            }
        }
        return { name: m.name, burned: burned, loi: loi, raw: m.analysis };
    });
    
    // 3. 构建矩阵 A 和向量 b
    let A = [];
    let b = [];
    for (let oi = 0; oi < oxideNames.length; oi++) {
        let ox = oxideNames[oi];
        let row = [];
        for (let mi = 0; mi < matList.length; mi++) {
            row.push(matList[mi].burned[ox] || 0);
        }
        A.push(row);
        b.push(target[ox]);
    }
    
    // 4. 求解
    let solution = nnls(A, b);
    
    // 5. 转换回生料百分比
    let ingredients = [];
    let totalRaw = 0;
    for (let idx = 0; idx < solution.length; idx++) {
        if (solution[idx] > 0.01) {
            let rawAmt = solution[idx] * (100 - matList[idx].loi) / 100;
            ingredients.push({
                material: matList[idx].name,
                ratio: rawAmt,
                burnedRatio: solution[idx]
            });
            totalRaw += rawAmt;
        }
    }
    
    // 归一化到 100%
    for (let i = 0; i < ingredients.length; i++) {
        ingredients[i].ratio = ingredients[i].ratio / totalRaw * 100;
    }
    
    // 按百分比排序
    ingredients.sort(function(a, b) { return b.ratio - a.ratio; });
    
    // 计算误差
    let actual = {};
    for (let ox in target) actual[ox] = 0;
    for (let i = 0; i < ingredients.length; i++) {
        let item = ingredients[i];
        let mat = materials.find(function(m) { return m.name === item.material; });
        if (!mat) continue;
        for (let ox in target) {
            actual[ox] += item.ratio * (mat.analysis[ox] || 0) / 100;
        }
    }
    let actTotal = 0;
    for (let ox in actual) actTotal += actual[ox];
    for (let ox in actual) actual[ox] = actual[ox] / actTotal * 100;
    
    let sumSq = 0;
    for (let ox in target) {
        let diff = actual[ox] - target[ox];
        sumSq += diff * diff;
    }
    let rmse = Math.sqrt(sumSq / Object.keys(target).length);
    
    // 找出缺失的氧化物（目标中有但原料库无法提供的）
    let missingOxides = [];
    for (let ox in target) {
        if (actual[ox] < target[ox] * 0.5 && target[ox] > 1) {
            missingOxides.push(ox);
        }
    }
    
    return { ingredients: ingredients, rmse: rmse, missingOxides: missingOxides };
}

// ========== 渲染函数 ==========

function renderDetail() {
    let glaze = glazes.find(function(item) { return item.id == id; });
    if (!glaze) {
        document.getElementById("detailName").textContent = "未找到该釉方";
        return;
    }

    document.getElementById("detailName").textContent = glaze.name;

    let style = getGlazeStyle(glaze.category);
    document.getElementById("detailImg").style.background = style.bg;
    document.getElementById("detailShine").style.background = style.shine;

    let tagsHtml = "";
    tagsHtml += '<span class="tag tag-cat">' + glaze.category + '</span>';
    tagsHtml += '<span class="tag tag-atm">' + (glaze.atmosphere || "未知") + '</span>';
    if (glaze.difficulty) {
        let diffColor = glaze.difficulty === "简单" ? "#4a7c3f" :
                        glaze.difficulty === "困难" ? "#c62828" : "#8b6f47";
        tagsHtml += '<span class="tag" style="background:#f0ebe3;color:' + diffColor + ';">' + glaze.difficulty + '</span>';
    }
    if (glaze.usage && glaze.usage.length > 0) {
        glaze.usage.forEach(function(u) {
            tagsHtml += '<span class="tag-usage">' + u + '</span>';
        });
    }
    document.getElementById("detailTags").innerHTML = tagsHtml;

    document.getElementById("detailMeta").innerHTML =
        (glaze.temperature || "") + " · " + (glaze.surface || "") + " · " + (glaze.stability || "");

    if (glaze.seger_formula && Object.keys(glaze.seger_formula).length > 0) {
        document.getElementById("segerCard").style.display = "block";

        let roGroup = [], r2o3Group = [], ro2Group = [];
        for (let ox in glaze.seger_formula) {
            let val = glaze.seger_formula[ox];
            if (["K2O","Na2O","Li2O","CaO","MgO","ZnO","BaO","SrO","CoO","CuO","NiO"].indexOf(ox) >= 0) {
                roGroup.push(ox + " " + val.toFixed(3));
            } else if (["Al2O3","B2O3","Cr2O3"].indexOf(ox) >= 0) {
                r2o3Group.push(ox + " " + val.toFixed(3));
            } else {
                ro2Group.push(ox + " " + val.toFixed(3));
            }
        }

        document.getElementById("segerBox").innerHTML =
            '<div><strong>RO</strong>　　' + (roGroup.join(" · ") || "—") + '</div>' +
            '<div><strong>R₂O₃</strong>　' + (r2o3Group.join(" · ") || "—") + '</div>' +
            '<div><strong>RO₂</strong>　 ' + (ro2Group.join(" · ") || "—") + '</div>';

        let sio2 = glaze.seger_formula.SiO2 || 0;
        let al2o3 = glaze.seger_formula.Al2O3 || 0;
        let ratio = al2o3 ? (sio2 / al2o3).toFixed(2) : "";
        document.getElementById("segerMetrics").innerHTML =
            '<div class="metric-item"><div class="metric-value">' + ratio + '</div><div class="metric-label">SiO₂/Al₂O₃</div></div>' +
            '<div class="metric-item"><div class="metric-value">' + al2o3.toFixed(3) + '</div><div class="metric-label">Al₂O₃/RO</div></div>' +
            '<div class="metric-item"><div class="metric-value">—</div><div class="metric-label">CTE</div></div>';
    }

    // 原料配比显示
    let recipeHtml = "";
    if (glaze.ingredients && glaze.ingredients.length > 0) {
        // 有原始原料配比
        glaze.ingredients.forEach(function(item) {
            recipeHtml += '<div class="ingredient"><span>' + item.material + '</span><span>' + item.ratio + '</span></div>';
        });
        if (glaze.base_ratio_total) {
            recipeHtml += '<div style="margin-top:8px;font-size:12px;color:var(--text-muted);">基础釉合计：' + glaze.base_ratio_total + '</div>';
        }
    } else if (glaze.seger_formula && materials.length > 0) {
        // 无原料配比，但有塞格尔式 → AI 反推
        let result = reverseRecipe(glaze.seger_formula);
        if (result && result.ingredients.length > 0) {
            recipeHtml +=
                '<div class="note-box info">' +
                    '<strong>🤖 AI 推算配方</strong><br>' +
                    '此釉方来自 Glazy 数据库，原作者未公开原料配比。以下配方由系统根据塞格尔式自动反推生成，仅供参考。实际配方可能因原料品牌、纯度不同而有差异。' +
                '</div>';
            
            result.ingredients.forEach(function(item) {
                recipeHtml += '<div class="ingredient"><span>' + item.material + '</span><span>' + item.ratio.toFixed(2) + '%</span></div>';
            });
            
            recipeHtml += '<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">基础釉合计：100.00</div>';
            
            // 显示推算精度
            let accuracyText = result.rmse < 1 ? "很高" : result.rmse < 3 ? "较高" : "一般";
            let accuracyColor = result.rmse < 1 ? "var(--success)" : result.rmse < 3 ? "var(--warn)" : "#c62828";
            recipeHtml += '<div style="margin-top:8px;font-size:11px;color:' + accuracyColor + ';">推算精度：' + accuracyText + ' (RMSE: ' + result.rmse.toFixed(2) + ')</div>';
            
            // 缺失氧化物提示
            if (result.missingOxides.length > 0) {
                recipeHtml += '<div class="note-box" style="margin-top:10px;">' +
                    '<strong>⚠ 注意</strong><br>' +
                    '以下氧化物在现有原料库中缺乏对应原料，推算结果可能偏差较大：' + result.missingOxides.join("、") +
                '</div>';
            }
            
            recipeHtml += '<div style="display:flex;gap:10px;margin-top:12px;">' +
                '<button class="action-btn secondary" style="width:auto;padding:10px 16px;font-size:13px;" onclick="copySeger()">📋 复制塞格尔式</button>' +
            '</div>';
        } else {
            recipeHtml =
                '<div class="note-box">' +
                    '<strong>⚠ 原料配比未公开</strong><br>' +
                    '此釉方来自 Glazy 公开数据库，原作者仅提供了氧化物分析数据（塞格尔式），未公开具体原料配比。' +
                '</div>' +
                '<div style="display:flex;gap:10px;margin-top:12px;">' +
                    '<a href="calculator.html" class="action-btn primary" style="text-decoration:none;display:inline-block;width:auto;padding:10px 16px;font-size:13px;">🧮 用塞格尔式反推配方</a>' +
                    '<button class="action-btn secondary" style="width:auto;padding:10px 16px;font-size:13px;" onclick="copySeger()">📋 复制塞格尔式</button>' +
                '</div>';
        }
    } else {
        // 既无原料配比，也无塞格尔式
        recipeHtml =
            '<div class="note-box">' +
                '<strong>⚠ 原料配比未公开</strong><br>' +
                '此釉方未提供原料配比或塞格尔式数据。' +
            '</div>';
    }
    document.getElementById("recipeContent").innerHTML = recipeHtml;

    document.getElementById("firingInfo").innerHTML =
        '<strong>温度：</strong>' + (glaze.temperature || "暂无") + '<br>' +
        '<strong>气氛：</strong>' + (glaze.atmosphere || "暂无") + '<br>' +
        '<strong>难度：</strong>' + (glaze.difficulty || "暂无") + '<br>' +
        '<strong>稳定性：</strong>' + (glaze.stability || "暂无") + '<br>' +
        '<strong>表面：</strong>' + (glaze.surface || "暂无");

    document.getElementById("processInfo").innerHTML =
        '<strong>工艺：</strong>' + (glaze.process || "暂无") + '<br><br>' +
        '<strong>注意事项：</strong>' + (glaze.notes || "暂无");

    document.getElementById("sourceInfo").innerHTML =
        '<strong>类型：</strong>' + (glaze.recipe_type || "暂无") + '<br>' +
        '<strong>状态：</strong>' + (glaze.recipe_status || "暂无") + '<br>' +
        '<strong>验证等级：</strong>' + (glaze.verification || "暂无") + '<br>' +
        '<strong>来源：</strong>' + (glaze.source || "暂无");

    if (glaze.seger_formula) {
        document.getElementById("predCard").style.display = "block";
        let sio2 = glaze.seger_formula.SiO2 || 0;
        let al2o3 = glaze.seger_formula.Al2O3 || 0;
        let ratio = al2o3 ? sio2 / al2o3 : 0;

        let temp = glaze.temperature || "温度未知";
        let gloss = ratio > 7 ? "透明亮光倾向" : ratio > 4 ? "正常光泽倾向" : "亚光或晶体倾向";
        let transparency = al2o3 < 0.35 && ratio > 5 ? "透明度较高" : al2o3 < 0.55 ? "半透明倾向" : "乳浊或半哑倾向";

        document.getElementById("predTags").innerHTML =
            '<span class="pred-tag">' + temp + '</span>' +
            '<span class="pred-tag">' + gloss + '</span>' +
            '<span class="pred-tag secondary">' + transparency + '</span>';

        document.getElementById("limitCard").style.display = "block";
        document.getElementById("limitContent").innerHTML =
            '<div class="limit-item"><span>SiO₂ (3.5-6.0)</span><span class="' + (sio2 >= 3.5 && sio2 <= 6.0 ? 'limit-pass' : 'limit-warn') + '">' + sio2.toFixed(2) + ' ' + (sio2 >= 3.5 && sio2 <= 6.0 ? '✓' : '⚠') + '</span></div>' +
            '<div class="limit-item"><span>Al₂O₃ (0.35-0.65)</span><span class="' + (al2o3 >= 0.35 && al2o3 <= 0.65 ? 'limit-pass' : 'limit-warn') + '">' + al2o3.toFixed(3) + ' ' + (al2o3 >= 0.35 && al2o3 <= 0.65 ? '✓' : '⚠') + '</span></div>' +
            '<div class="limit-item"><span>硅铝比 (3-12)</span><span class="' + (ratio >= 3 && ratio <= 12 ? 'limit-pass' : 'limit-warn') + '">' + ratio.toFixed(2) + ' ' + (ratio >= 3 && ratio <= 12 ? '✓' : '⚠') + '</span></div>';
    }

    renderSimilar(glaze);
}

function renderSimilar(current) {
    if (!glazes.length) return;
    let similar = glazes.filter(function(g) {
        return g.id !== current.id && g.category === current.category;
    }).slice(0, 3);

    if (similar.length === 0) return;

    document.getElementById("similarCard").style.display = "block";
    document.getElementById("similarContent").innerHTML = similar.map(function(g) {
        let sio2 = g.seger_formula && g.seger_formula.SiO2 ? g.seger_formula.SiO2 : 0;
        let al2o3 = g.seger_formula && g.seger_formula.Al2O3 ? g.seger_formula.Al2O3 : 0;
        let ratio = al2o3 ? (sio2 / al2o3).toFixed(2) : "";
        return '<a href="detail.html?id=' + g.id + '" class="similar-item">' +
            '<div class="similar-name">' + g.name + '</div>' +
            '<div class="similar-meta">' + (g.temperature || "") + (ratio ? " · SiO₂/Al₂O₃ = " + ratio : "") + '</div>' +
        '</a>';
    }).join("");
}

function copySeger() {
    let glaze = glazes.find(function(item) { return item.id == id; });
    if (!glaze || !glaze.seger_formula) return;
    let text = "Seger Formula:\n";
    for (let ox in glaze.seger_formula) {
        text += ox + ": " + glaze.seger_formula[ox].toFixed(3) + "\n";
    }
    navigator.clipboard.writeText(text).then(function() {
        alert("塞格尔式已复制到剪贴板");
    });
}
