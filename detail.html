<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉方档案</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:800px;
margin:auto;
padding:20px;
background:#f5f2eb;
}

.back{
margin-bottom:20px;
}

.back a{
color:#5c4033;
text-decoration:none;
}

.card{
background:white;
padding:25px;
border-radius:12px;
}

h1{
color:#5c4033;
}

.image{
width:100%;
border-radius:12px;
margin-bottom:20px;
}

.section{
margin-top:25px;
}

.section h3{
border-bottom:1px solid #ddd;
padding-bottom:6px;
}

.info{
line-height:1.9;
}

.tag{
display:inline-block;
background:#8b6f47;
color:white;
padding:5px 12px;
border-radius:20px;
margin:4px;
}

.ingredient{
display:flex;
justify-content:space-between;
background:#f5f2eb;
padding:8px;
margin:5px 0;
border-radius:6px;
}

</style>

</head>


<body>


<div class="back">

<a href="index.html">

← 返回釉库

</a>

</div>


<div id="content"></div>



<script>


let id =
new URLSearchParams(
window.location.search
).get("id");



fetch("glazes.json")

.then(res=>res.json())

.then(data=>{


let glaze=data.find(
item=>item.id==id
);



if(!glaze){

document.getElementById("content").innerHTML=
"未找到该釉方";

return;

}



let ingredients="";


if(glaze.ingredients){

glaze.ingredients.forEach(item=>{

ingredients += `

<div class="ingredient">

<span>${item.material}</span>

<span>${item.ratio}</span>

</div>

`;

});

}



let additives="";


if(glaze.additives && glaze.additives.length){


glaze.additives.forEach(item=>{


additives += `

<div class="ingredient">

<span>${item.material}</span>

<span>${item.ratio}</span>

</div>

`;


});


}



let usage="";


if(glaze.usage){

glaze.usage.forEach(item=>{


usage += `

<span class="tag">

${item}

</span>

`;


});


}



let alias="";


if(glaze.alias){


glaze.alias.forEach(item=>{


alias += `

<span class="tag">

${item}

</span>

`;


});


}



let image="";


if(glaze.image){


image=

`

<img

class="image"

src="${glaze.image}"

>

`;

}



document.getElementById("content").innerHTML=


`

<div class="card">


${image}



<h1>

${glaze.name}

</h1>


<div>

${alias}

</div>



<div class="section info">


分类：

${glaze.category || "暂无"}

<br>


颜色：

${glaze.color || "暂无"}

<br>


釉面：

${glaze.surface || "暂无"}

<br>


烧成温度：

${glaze.temperature || "暂无"}

<br>


气氛：

${glaze.atmosphere || "暂无"}


</div>





<div class="section">


<h3>

应用场景

</h3>


<div>

${usage || "暂无"}

</div>


</div>





<div class="section info">


<h3>

烧制评价

</h3>


难度：

${glaze.difficulty || "暂无"}

<br>


稳定性：

${glaze.stability || "暂无"}


</div>





<div class="section">


<h3>

适用泥料

</h3>


<div class="info">

${glaze.clay || "暂无"}

</div>


</div>





<div class="section">


<h3>

配方

</h3>


${ingredients || "暂无"}


${glaze.base_ratio_total ? `

<p>

基础配方比例：

${glaze.base_ratio_total}

</p>

` : ""}


</div>





<div class="section">


<h3>

添加剂

</h3>


${additives || "暂无"}


</div>





<div class="section info">


<h3>

配方信息

</h3>


配方类型：

${glaze.recipe_type || "暂无"}

<br>


配方状态：

${glaze.recipe_status || "暂无"}

<br>


可信等级：

${glaze.verification || "暂无"}


</div>





<div class="section">


<h3>

制作流程

</h3>


<div class="info">

${glaze.process || "暂无"}

</div>


</div>





<div class="section">


<h3>

注意事项

</h3>


<div class="info">

${glaze.notes || "暂无"}

</div>


</div>





<div class="section">


<h3>

资料来源

</h3>


<div class="info">

${glaze.source || "暂无"}

</div>


</div>



</div>


`;

});


</script>


</body>

</html>
