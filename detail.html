<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>釉方详情</title>


<style>

body{

font-family:Arial,sans-serif;

max-width:800px;

margin:auto;

padding:20px;

background:#f5f2eb;

}


.card{

background:white;

padding:25px;

border-radius:12px;

}


h1{

color:#5c4033;

}


.item{

margin-top:15px;

line-height:1.8;

}


.back{

margin-bottom:20px;

}


</style>

</head>


<body>


<div class="back">

<a href="index.html">
← 返回釉库
</a>

</div>


<div id="content"></div>



<script>


let id =
new URLSearchParams(
window.location.search
).get("id");



fetch("glazes.json")

.then(res=>res.json())

.then(data=>{


let glaze =
data.find(
item=>item.id==id
);



let ingredient="";


glaze.ingredients.forEach(i=>{


ingredient +=

`
${i.material}
：
${i.ratio}
<br>
`

});



document
.getElementById("content")
.innerHTML=

`

<div class="card">


<h1>
${glaze.name}
</h1>


<div class="item">

分类：
${glaze.category}

</div>


<div class="item">

烧成温度：
${glaze.temperature}

</div>


<div class="item">

烧成气氛：
${glaze.atmosphere}

</div>



<h3>
配方
</h3>

<div class="item">

${ingredient}

</div>



<h3>
制作流程
</h3>


<div class="item">

${glaze.process}

</div>



<h3>
备注
</h3>


<div class="item">

${glaze.notes}

</div>



<h3>
来源
</h3>


<div class="item">

${glaze.source}

</div>


</div>

`;


});


</script>


</body>

</html>
