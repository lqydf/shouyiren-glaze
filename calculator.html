<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉式试算</title>


<style>

body{
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
background:#f5f2eb;
}

h1,h2,h3{
color:#5c4033;
}

.card{
background:white;
padding:25px;
border-radius:12px;
margin-top:20px;
}


select,input{

padding:10px;
border:1px solid #ddd;
border-radius:6px;

}


.row{

display:flex;
gap:10px;
margin:8px 0;

}


.row select{

flex:2;

}


.row input{

flex:1;

}


button{

background:#8b6f47;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
margin:5px;

}


.result{

background:#faf7f0;
padding:15px;
border-radius:10px;
line-height:1.8;

}


.ok{
color:green;
}


.error{
color:red;
}


.item{

display:flex;
justify-content:space-between;
padding:5px;

}

</style>

</head>


<body>


<h1>
守艺人 · 釉式试算
</h1>


<div class="card">


<h3>
配方输入
</h3>


<div id="rows"></div>


<button onclick="addRow()">
+ 添加原料
</button>


<button onclick="calculate()">
开始计算
</button>


</div>



<div class="card">


<h3>
计算结果
</h3>


<div id="result">

等待计算

</div>


</div>





<script>


let materials=[];


let rows=document.getElementById("rows");



fetch("materials.json")

.then(res=>res.json())

.then(data=>{


materials=data;


addRow();


});





function addRow(){


let div=document.createElement("div");


div.className="row";



let select=document.createElement("select");


materials.forEach(m=>{


let option=document.createElement("option");


option.value=m.name;

option.textContent=m.name;


select.appendChild(option);


});



let input=document.createElement("input");


input.type="number";

input.placeholder="%";


let del=document.createElement("button");


del.innerHTML="删除";


del.onclick=function(){

div.remove();

};


div.appendChild(select);

div.appendChild(input);

div.appendChild(del);


rows.appendChild(div);


}





function calculate(){



let list=[];

let total=0;



document.querySelectorAll(".row")

.forEach(row=>{


let name=row.querySelector("select").value;


let ratio=parseFloat(

row.querySelector("input").value

);



if(!isNaN(ratio)){


total+=ratio;


list.push({

name:name,

ratio:ratio

});


}


});





let html="";



if(total!=100){


html+=`

<p class="error">

当前比例：

${total}%


<br>

请调整到100%

</p>

`;

return show(html);


}



html+=`

<p class="ok">

✔ 配方比例：100%

</p>

`;



let oxide={};



list.forEach(item=>{


let mat=

materials.find(

m=>m.name==item.name

);



if(!mat)return;



for(let key in mat.oxides){


oxide[key]=

(oxide[key]||0)

+

mat.oxides[key]

*

item.ratio

/

100;


}



});





let RO=[

"K2O",

"Na2O",

"CaO",

"MgO",

"ZnO",

"BaO"

];


let R2O3=[

"Al2O3"

];


let RO2=[

"SiO2"

];




let flux=0;


RO.forEach(x=>{


flux+=oxide[x]||0;


});





html+=`

<h3>
Seger Formula
</h3>

<h4>
RO
</h4>

`;



RO.forEach(x=>{


if(oxide[x]){


html+=`

<div class="item">

<span>${x}</span>

<span>

${(oxide[x]/flux).toFixed(3)}

</span>

</div>

`;

}


});




html+=`

<h4>
R2O3
</h4>

`;



R2O3.forEach(x=>{


if(oxide[x]){


html+=`

<div class="item">

<span>${x}</span>

<span>

${(oxide[x]/flux).toFixed(3)}

</span>

</div>

`;

}


});




html+=`

<h4>
RO2
</h4>

`;



RO2.forEach(x=>{


if(oxide[x]){


html+=`

<div class="item">

<span>${x}</span>

<span>

${(oxide[x]/flux).toFixed(3)}

</span>

</div>

`;

}


});





let ratioSA=

oxide.SiO2 /

oxide.Al2O3;



html+=`

<h3>
釉性分析
</h3>


SiO₂ / Al₂O₃：

${ratioSA.toFixed(2)}

<br>

`;



if(ratioSA>6){

html+=`

倾向：

高硅硬质釉，高温透明或半透明

`;

}

else{

html+=`

倾向：

熔融较好，可能偏流动

`;

}



show(html);



}




function show(html){

document.getElementById("result").innerHTML=html;

}



</script>


</body>

</html>
