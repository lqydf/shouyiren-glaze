<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉式试算</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
background:#f5f2eb;
}

h1,h2,h3{
color:#5c4033;
}

.card{
background:white;
padding:25px;
border-radius:12px;
margin-top:20px;
}

.row{
display:flex;
gap:10px;
margin:8px 0;
}

select,input{
padding:10px;
border:1px solid #ddd;
border-radius:6px;
}

select{
flex:2;
}

input{
flex:1;
}

button{
background:#8b6f47;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
}

.result{
background:#faf7f0;
padding:15px;
border-radius:10px;
line-height:1.8;
}

.item{
display:flex;
justify-content:space-between;
}

.ok{
color:green;
}

.error{
color:red;
}

</style>

</head>


<body>


<h1>
守艺人 · 釉式试算
</h1>


<div class="card">

<h3>
输入配方
</h3>

<div id="rows"></div>

<button onclick="addRow()">
添加原料
</button>

<button onclick="calculate()">
开始计算
</button>

</div>



<div class="card">

<h3>
计算结果
</h3>

<div id="result">
等待计算
</div>

</div>



<script>


let materials=[];


fetch("materials.json")

.then(r=>r.json())

.then(data=>{

materials=data;

addRow();

});




function addRow(){


let div=document.createElement("div");

div.className="row";


let select=document.createElement("select");


materials.forEach(m=>{

let o=document.createElement("option");

o.value=m.name;

o.textContent=m.name;

select.appendChild(o);

});



let input=document.createElement("input");

input.type="number";

input.placeholder="比例 %";



let del=document.createElement("button");

del.textContent="删除";

del.onclick=()=>div.remove();



div.appendChild(select);

div.appendChild(input);

div.appendChild(del);


document.getElementById("rows").appendChild(div);


}




function calculate(){


let rows=document.querySelectorAll(".row");


let list=[];

let total=0;


rows.forEach(r=>{


let name=r.querySelector("select").value;

let ratio=parseFloat(

r.querySelector("input").value

);


if(!isNaN(ratio)){

total+=ratio;


list.push({

name,

ratio

});


}


});



let html="";



if(total!=100){

document.getElementById("result").innerHTML=

`
<p class="error">

当前比例 ${total}%

请调整到100%

</p>
`;

return;

}




html+=`

<p class="ok">

✔ 配方比例 100%

</p>

`;



let oxide={};



list.forEach(item=>{


let mat=

materials.find(

m=>m.name==item.name

);



if(!mat)return;


for(let x in mat.oxides){

oxide[x]=

(oxide[x]||0)

+

mat.oxides[x]

*

item.ratio

/

100;

}


});





let RO=[

"K2O",
"Na2O",
"CaO",
"MgO",
"ZnO",
"BaO"

];



let flux=0;


RO.forEach(x=>{

flux+=oxide[x]||0;

});



html+=`

<h3>
Seger Formula
</h3>

<h4>
RO
</h4>

`;



RO.forEach(x=>{


if(oxide[x]){

html+=`

<div class="item">

${x}

${(oxide[x]/flux).toFixed(3)}

</div>

`;

}

});



html+=`

<h4>
R2O3
</h4>

`;



if(oxide.Al2O3){

html+=`

<div class="item">

Al2O3

${(oxide.Al2O3/flux).toFixed(3)}

</div>

`;

}



html+=`

<h4>
RO2
</h4>

`;



if(oxide.SiO2){

html+=`

<div class="item">

SiO2

${(oxide.SiO2/flux).toFixed(3)}

</div>

`;

}





let siAl=

oxide.SiO2/

oxide.Al2O3;



let temperature="";

let gloss="";

let flow="";



if(flux>45){

temperature="1180-1250℃";

flow="流动性较强";

}

else{

temperature="1250℃以上";

flow="稳定型高温釉";

}



if(siAl>6){

gloss="透明亮光倾向";

}

else if(siAl>3){

gloss="半哑光倾向";

}

else{

gloss="亚光倾向";

}





html+=`

<h3>
釉性预测
</h3>


预计烧成：

${temperature}

<br>


釉面：

${gloss}

<br>


流动性：

${flow}

<br>


SiO₂ / Al₂O₃：

${siAl.toFixed(2)}

<br>


<p>

说明：

该结果为理论试算，
实际效果受胎土、厚度、气氛、升降温曲线影响。

</p>

`;



document.getElementById("result").innerHTML=html;


}


</script>


</body>

</html>
