<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉式计算</title>


<style>

body{

font-family:Arial,sans-serif;

max-width:850px;

margin:auto;

padding:20px;

background:#f5f2eb;

}


h1,h2,h3{

color:#5c4033;

}


.card{

background:white;

padding:25px;

border-radius:12px;

margin-top:20px;

}


select{

width:100%;

padding:12px;

font-size:16px;

border-radius:8px;

border:1px solid #ddd;

}


.item{

display:flex;

justify-content:space-between;

background:#f5f2eb;

padding:8px;

margin:5px 0;

border-radius:6px;

}


.result{

background:#faf7f0;

padding:15px;

border-radius:8px;

margin-top:15px;

}


.ok{

color:green;

}


.error{

color:red;

}


.back a{

color:#5c4033;

text-decoration:none;

}


</style>


</head>


<body>


<div class="back">

<a href="index.html">
← 返回釉库
</a>

</div>


<h1>
守艺人 · Seger釉式计算
</h1>



<div class="card">


<select id="glazeSelect">

<option>
请选择釉方
</option>

</select>


<div id="result"></div>


</div>




<script>


let glazes=[];

let materials=[];



Promise.all([

fetch("glazes.json").then(r=>r.json()),

fetch("materials.json").then(r=>r.json())

])

.then(data=>{


glazes=data[0];

materials=data[1];



let select=document.getElementById("glazeSelect");



glazes.forEach(item=>{


let option=document.createElement("option");


option.value=item.id;

option.textContent=item.name;


select.appendChild(option);


});


});





document

.getElementById("glazeSelect")

.addEventListener(

"change",

function(){


calculate(this.value);


});





function calculate(id){


let glaze=glazes.find(

g=>g.id==id

);



if(!glaze)return;




let oxide={};


let total=0;




glaze.ingredients.forEach(item=>{


let ratio=parseFloat(item.ratio);


if(!isNaN(ratio)){

total+=ratio;

}



let material=

materials.find(

m=>m.name===item.material

);



if(!material)return;



for(let key in material.oxides){



let value=

material.oxides[key]

*

ratio

/

100;



oxide[key]=

(oxide[key]||0)+value;


}


});





let html=`

<h2>

${glaze.name}

</h2>



<h3>
原料比例
</h3>

`;




glaze.ingredients.forEach(item=>{


html+=`

<div class="item">

<span>${item.material}</span>

<span>${item.ratio}</span>

</div>

`;


});





if(total==100){


html+=`

<p class="ok">

✔ 配方比例：${total}%

</p>

`;


}else{


html+=`

<p class="error">

✘ 配方比例：${total}%

</p>

`;

}





let flux=0;



["K2O","Na2O","CaO","MgO","ZnO","BaO"]

.forEach(x=>{


flux+=oxide[x]||0;


});





html+=`

<div class="result">


<h3>
Seger Formula
</h3>



<h4>
RO（助熔剂）
</h4>

`;




let ro={};


["K2O","Na2O","CaO","MgO","ZnO","BaO"]

.forEach(x=>{


ro[x]=

(oxide[x]||0)

/

flux;


html+=`

<div class="item">

<span>${x}</span>

<span>${ro[x].toFixed(3)}</span>

</div>

`;


});




html+=`

<h4>
R2O3（中间体）
</h4>

`;



if(oxide.Al2O3){


html+=`

<div class="item">

<span>Al2O3</span>

<span>

${(oxide.Al2O3/flux).toFixed(3)}

</span>

</div>

`;

}



html+=`

<h4>
RO2（玻璃形成剂）
</h4>

`;



if(oxide.SiO2){


html+=`

<div class="item">

<span>SiO2</span>

<span>

${(oxide.SiO2/flux).toFixed(3)}

</span>

</div>

`;

}



html+=`

</div>

`;



document

.getElementById("result")

.innerHTML=html;


}



</script>


</body>

</html>
