<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · Seger釉式计算</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
background:#f5f2eb;
}


h1,h2,h3{
color:#5c4033;
}


.card{

background:white;
padding:25px;
border-radius:12px;
margin-top:20px;

}


.row{

display:flex;
gap:10px;
margin:8px 0;

}


select,input{

padding:10px;
border:1px solid #ccc;
border-radius:6px;

}


select{
flex:2;
}


input{
flex:1;
}


button{

background:#8b6f47;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;

}


.result{

background:#faf7f0;
padding:20px;
border-radius:10px;
line-height:1.8;

}


.item{

display:flex;
justify-content:space-between;

border-bottom:1px solid #ddd;

padding:5px;

}


.ok{
color:green;
}


.error{
color:red;
}


</style>

</head>


<body>


<h1>
守艺人 · Seger釉式计算
</h1>



<div class="card">


<h3>
输入釉方
</h3>


<div id="rows"></div>


<button onclick="addRow()">

+ 添加原料

</button>


<button onclick="calculate()">

计算Seger式

</button>


</div>




<div class="card">

<h3>
计算结果
</h3>


<div id="result">

等待输入

</div>


</div>




<script>


let materials=[];

let oxides=[];



Promise.all([

fetch("materials.json")
.then(r=>r.json()),

fetch("oxides.json")
.then(r=>r.json())

])

.then(data=>{


materials=data[0];

oxides=data[1];


addRow();


});





function addRow(){


let row=document.createElement("div");

row.className="row";



let select=document.createElement("select");



materials.forEach(m=>{


let option=document.createElement("option");


option.value=m.name;

option.textContent=m.name;


select.appendChild(option);


});




let input=document.createElement("input");


input.type="number";

input.placeholder="百分比";





let del=document.createElement("button");


del.textContent="删除";


del.onclick=function(){

row.remove();

};



row.appendChild(select);

row.appendChild(input);

row.appendChild(del);


document

.getElementById("rows")

.appendChild(row);


}
function calculate(){


let rows=document.querySelectorAll(".row");


let total=0;


let formula=[];



rows.forEach(row=>{


let name=row.querySelector("select").value;


let percent=parseFloat(

row.querySelector("input").value

);



if(!isNaN(percent)){


total+=percent;


formula.push({

name:name,

percent:percent

});


}


});





if(total!==100){


document.getElementById("result").innerHTML=

`

<p class="error">

当前比例：

${total.toFixed(2)}%

<br>

请调整到100%

</p>

`;

return;

}





let oxideWeight={};





// 计算各氧化物重量

formula.forEach(item=>{


let material=

materials.find(

m=>m.name===item.name

);



if(!material)return;



for(let oxide in material.oxides){



let weight=

material.oxides[oxide]

*

item.percent

/

100;



oxideWeight[oxide]=

(oxideWeight[oxide]||0)

+

weight;



}


});






// 氧化物换算摩尔


let moles={};



for(let oxide in oxideWeight){



let data=

oxides.find(

o=>o.oxide===oxide

);



if(!data)continue;



moles[oxide]=

oxideWeight[oxide]

/

data.molecular_weight;



}






// RO总量


let roTotal=0;



oxides

.filter(o=>o.group==="RO")

.forEach(o=>{


roTotal+=moles[o.oxide]||0;


});





// Seger归一化


let seger={};



for(let oxide in moles){


seger[oxide]=

moles[oxide]/roTotal;


}






let html="";



html+=`

<p class="ok">

✔ 配方比例正确：100%

</p>


<h3>

Seger Formula

</h3>

`;





html+=`

<h4>

RO

</h4>

`;




oxides

.filter(o=>o.group==="RO")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>

</div>

`;

}


});






html+=`

<h4>

R2O3

</h4>

`;



oxides

.filter(o=>o.group==="R2O3")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>


</div>

`;

}


});







html+=`

<h4>

RO2

</h4>

`;



oxides

.filter(o=>o.group==="RO2")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>

</div>

`;

}


});








// 比值分析


let sio2=

seger["SiO2"]||0;


let al2o3=

seger["Al2O3"]||0;




html+=`

<h3>

摩尔比分析

</h3>


SiO₂ / Al₂O₃：

${

al2o3?

(sio2/al2o3).toFixed(2)

:

"无法计算"

}



<br>


Al₂O₃ / RO：

${

(seger["Al2O3"]||0).toFixed(2)

}


`;







html+=`

<h3>

基础评价

</h3>

`;



if(sio2/al2o3>6){


html+=`

偏高硅：

透明、高硬度釉倾向

`;

}

else if(sio2/al2o3>3){


html+=`

中等硅铝比：

常规透明釉范围

`;

}

else{


html+=`

低硅铝比：

亚光或结晶倾向增加

`;

}




html+=`

<p>

注：

该结果基于原料理论分析。

实际烧成仍需结合：

胎土、厚度、气氛、升温曲线。

</p>

`;



document

.getElementById("result")

.innerHTML=html;



}


</script>


</body>

</html>
