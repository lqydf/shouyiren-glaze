<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · Seger釉式计算</title>


<style>

body{
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
background:#f5f2eb;
}


h1,h2,h3{
color:#5c4033;
}


.card{

background:white;
padding:25px;
border-radius:12px;
margin-top:20px;

}


.row{

display:flex;
gap:10px;
margin:8px 0;

}


select,input{

padding:10px;
border:1px solid #ccc;
border-radius:6px;

}


select{
flex:2;
}


input{
flex:1;
}


button{

background:#8b6f47;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;

}


.result{

background:#faf7f0;
padding:20px;
border-radius:10px;
line-height:1.8;

}


.item{

display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
padding:6px 0;

}


.ok{
color:green;
}


.error{
color:red;
}


</style>


</head>


<body>


<h1>
守艺人 · Seger釉式计算
</h1>



<div class="card">


<h3>
输入釉方比例
</h3>


<div id="rows"></div>



<button onclick="addRow()">
添加原料
</button>



<button onclick="calculate()">
计算 Seger 式
</button>


</div>




<div class="card">


<h3>
计算结果
</h3>


<div id="result">

等待计算

</div>


</div>




<script>


let materials=[];

let oxides=[];



Promise.all([


fetch("materials.json")
.then(r=>r.json()),


fetch("oxides.json")
.then(r=>r.json())


])


.then(data=>{


materials=data[0];

oxides=data[1];


addRow();


});





function addRow(){


let row=document.createElement("div");

row.className="row";



let select=document.createElement("select");



materials.forEach(m=>{


let option=document.createElement("option");


option.value=m.name;

option.textContent=m.name;


select.appendChild(option);


});




let input=document.createElement("input");


input.type="number";

input.placeholder="百分比";





let del=document.createElement("button");


del.textContent="删除";


del.onclick=function(){

row.remove();

};




row.appendChild(select);

row.appendChild(input);

row.appendChild(del);



document

.getElementById("rows")

.appendChild(row);


}





function calculate(){


let rows=document.querySelectorAll(".row");


let recipe=[];

let total=0;



rows.forEach(row=>{


let name=row.querySelector("select").value;


let percent=parseFloat(

row.querySelector("input").value

);



if(!isNaN(percent)){


total+=percent;


recipe.push({

name:name,

percent:percent

});


}


});



if(total!==100){


document.getElementById("result").innerHTML=

`

<p class="error">

当前比例：

${total.toFixed(2)}%

<br>

请调整到100%

</p>

`;

return;

}

// ==========================
// 氧化物重量计算
// ==========================

let oxideWeight={};


recipe.forEach(item=>{


let material=

materials.find(

m=>m.name===item.name

);



if(!material)return;



for(let oxide in material.oxides){


let value=

material.oxides[oxide]

*

item.percent

/

100;



oxideWeight[oxide]=

(oxideWeight[oxide]||0)

+

value;


}


});




// ==========================
// 氧化物摩尔计算
// ==========================


let mole={};



for(let oxide in oxideWeight){


let data=

oxides.find(

o=>o.oxide===oxide

);



if(!data)continue;



mole[oxide]=

oxideWeight[oxide]

/

data.molecular_weight;


}





// ==========================
// Seger归一化
// RO=1
// ==========================


let roTotal=0;



oxides

.filter(o=>o.group==="RO")

.forEach(o=>{


roTotal += mole[o.oxide] || 0;


});



let seger={};



for(let oxide in mole){


seger[oxide]=

mole[oxide]/roTotal;


}





// ==========================
// 输出
// ==========================


let html="";


html+=`

<p class="ok">

✔ 配方比例正确：100%

</p>


<h3>
氧化物摩尔分析
</h3>

`;



for(let oxide in mole){


html+=`

<div class="item">

<span>

${oxide}

</span>


<span>

${mole[oxide].toFixed(4)}

</span>


</div>

`;

}




html+=`

<h3>
Seger Formula
</h3>

`;




// RO


html+=`

<h4>
RO
</h4>

`;



oxides

.filter(o=>o.group==="RO")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>

</div>

`;

}


});




// R2O3


html+=`

<h4>
R2O3
</h4>

`;



oxides

.filter(o=>o.group==="R2O3")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>

</div>

`;

}


});




// RO2


html+=`

<h4>
RO2
</h4>

`;



oxides

.filter(o=>o.group==="RO2")

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>
${o.oxide}
</span>


<span>
${seger[o.oxide].toFixed(3)}
</span>

</div>

`;

}


});






// ==========================
// 摩尔比
// ==========================


let sio2=

seger["SiO2"] || 0;


let al2o3=

seger["Al2O3"] || 0;



html+=`

<h3>
关键比例
</h3>


SiO₂ / Al₂O₃：

${

al2o3 ?

(sio2/al2o3).toFixed(3)

:

"无法计算"

}


<br>


Al₂O₃ / RO：

${

(al2o3).toFixed(3)

}



`;





html+=`

<h3>
说明
</h3>


<p>

以上为理论 Seger 摩尔计算。

实际烧成效果仍受：

<br>

1. 原料实际化学分析

<br>

2. 胎土组成

<br>

3. 釉层厚度

<br>

4. 烧成气氛

<br>

5. 冷却速度

影响。

</p>

`;





document

.getElementById("result")

.innerHTML=html;



}



</script>


</body>

</html>
