<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉式计算</title>


<style>

body{

font-family:Arial,sans-serif;

max-width:800px;

margin:auto;

padding:20px;

background:#f5f2eb;

}


h1{

color:#5c4033;

}


.card{

background:white;

padding:25px;

border-radius:12px;

margin-top:20px;

}


select,input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:8px;

border:1px solid #ddd;

font-size:16px;

}



button{

background:#8b6f47;

color:white;

border:none;

padding:10px 20px;

border-radius:20px;

cursor:pointer;

}



.item{

display:flex;

justify-content:space-between;

background:#f5f2eb;

padding:8px;

margin:6px 0;

border-radius:6px;

}


.ok{

color:green;

}


.error{

color:red;

}


.back{

margin-bottom:20px;

}


a{

color:#5c4033;

text-decoration:none;

}


</style>


</head>


<body>


<div class="back">

<a href="index.html">
← 返回釉库
</a>

</div>



<h1>
守艺人 · 釉式计算
</h1>



<div class="card">


<select id="glazeSelect">

<option>
请选择釉方
</option>

</select>


<div id="result"></div>


</div>





<script>


let glazes=[];


let select=

document.getElementById("glazeSelect");


let result=

document.getElementById("result");



fetch("glazes.json")

.then(res=>res.json())

.then(data=>{


glazes=data;


data.forEach(item=>{


let option=document.createElement("option");


option.value=item.id;


option.textContent=item.name;


select.appendChild(option);


});


});





select.addEventListener(

"change",

function(){


let glaze=

glazes.find(

item=>item.id==this.value

);



if(!glaze){

result.innerHTML="";

return;

}



let total=0;


let html=`

<h2>

${glaze.name}

</h2>


<h3>
原料比例
</h3>

`;




glaze.ingredients.forEach(item=>{


let value=

parseFloat(item.ratio);



if(!isNaN(value)){

total+=value;

}



html+=`

<div class="item">

<span>
${item.material}
</span>

<span>
${item.ratio}
</span>

</div>

`;


});



let status="";


if(total==100){

status=

`

<p class="ok">

✔ 配方比例合计：${total}%

</p>

`;

}else{


status=

`

<p class="error">

✘ 配方比例合计：${total}%，需要校正

</p>

`;

}



html+=status;



html+=`

<hr>

<h3>
Seger 摩尔计算
</h3>


<p>

下一版本接入 materials.json 自动计算：

</p>


<p>

RO / R2O3 / RO2

</p>

`;



result.innerHTML=html;


});


</script>


</body>

</html>
