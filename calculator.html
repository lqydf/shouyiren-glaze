<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 釉式分析</title>


<style>

body{

font-family:Arial,sans-serif;

max-width:900px;

margin:auto;

padding:20px;

background:#f5f2eb;

}


h1,h2,h3{

color:#5c4033;

}



.card{

background:white;

padding:25px;

border-radius:12px;

margin-top:20px;

}



.row{

display:flex;

gap:10px;

margin:8px 0;

}



select,input{

padding:10px;

border:1px solid #ccc;

border-radius:6px;

}



select{

flex:2;

}



input{

flex:1;

}



button{

background:#8b6f47;

color:white;

border:none;

padding:10px 18px;

border-radius:20px;

cursor:pointer;

}



.result{

background:#faf7f0;

padding:20px;

border-radius:10px;

line-height:1.8;

}



.item{

display:flex;

justify-content:space-between;

border-bottom:1px solid #ddd;

padding:5px 0;

}



.ok{

color:green;

}



.error{

color:red;

}


.tag{

display:inline-block;

background:#8b6f47;

color:white;

padding:5px 10px;

border-radius:15px;

margin:3px;

}


</style>


</head>


<body>


<h1>
守艺人 · 釉式分析
</h1>



<div class="card">


<h3>
釉方输入
</h3>


<div id="rows"></div>


<button onclick="addRow()">

添加原料

</button>



<button onclick="calculate()">

开始分析

</button>


</div>





<div class="card">


<h3>

分析结果

</h3>


<div id="result">

等待计算

</div>


</div>





<script>


let materials=[];

let oxides=[];



Promise.all([

fetch("materials.json")
.then(r=>r.json()),


fetch("oxides.json")
.then(r=>r.json())


])

.then(data=>{


materials=data[0];

oxides=data[1];


addRow();


})

.catch(error=>{

document.getElementById("result").innerHTML=

`
<p class="error">
数据库读取失败，请检查 materials.json 或 oxides.json
</p>
`;

});




function addRow(){


let row=document.createElement("div");


row.className="row";



let select=document.createElement("select");



materials.forEach(m=>{


let option=document.createElement("option");


option.value=m.name;


option.textContent=m.name;


select.appendChild(option);


});




let input=document.createElement("input");


input.type="number";


input.placeholder="百分比";




let remove=document.createElement("button");


remove.textContent="删除";


remove.onclick=function(){

row.remove();

};





row.appendChild(select);

row.appendChild(input);

row.appendChild(remove);



document

.getElementById("rows")

.appendChild(row);


}
function calculate(){


let rows=document.querySelectorAll(".row");


let recipe=[];

let total=0;



rows.forEach(row=>{


let name=row.querySelector("select").value;


let percent=parseFloat(

row.querySelector("input").value

);



if(!isNaN(percent)){


total+=percent;


recipe.push({

name:name,

percent:percent

});


}


});





if(Math.abs(total-100)>0.01){


document.getElementById("result").innerHTML=

`

<p class="error">

当前比例：

${total.toFixed(2)}%

<br>

请调整到100%

</p>

`;

return;

}





// ======================
// 原料 → 氧化物重量
// 新版读取 analysis
// ======================


let oxideWeight={};



recipe.forEach(item=>{


let material=

materials.find(

m=>m.name===item.name

);



if(!material)return;



for(let oxide in material.analysis){



oxideWeight[oxide]=

(oxideWeight[oxide]||0)

+

material.analysis[oxide]

*

item.percent

/

100;



}


});





// ======================
// 氧化物摩尔计算
// ======================


let mole={};



for(let oxide in oxideWeight){


let info=

oxides.find(

o=>o.oxide===oxide

);



if(info){


mole[oxide]=

oxideWeight[oxide]

/

info.molecular_weight;


}


}





// ======================
// Seger RO归一化
// ======================


let ro=0;


oxides

.filter(o=>o.group==="RO")

.forEach(o=>{


ro+=mole[o.oxide]||0;


});



let r2o=0;


oxides

.filter(o=>o.group==="R2O")

.forEach(o=>{


r2o+=mole[o.oxide]||0;


});





let base=ro+r2o;



let seger={};



for(let oxide in mole){


seger[oxide]=

mole[oxide]/base;


}





let sio2=

seger["SiO2"]||0;


let al2o3=

seger["Al2O3"]||0;


let ratio=

al2o3?

sio2/al2o3

:0;





// ======================
// 釉性判断
// ======================


let temperature="";

let gloss="";

let transparency="";

let flow="";

let risk="";





// 温度判断


if(base>1.2){

temperature="低温熔融倾向（约1200℃以下）";

}

else if(base>0.8){

temperature="中高温釉倾向（约1200-1280℃）";

}

else{

temperature="高温硬质釉倾向（1280℃以上）";

}




// 光泽判断


if(ratio>7){

gloss="透明亮光倾向";

}

else if(ratio>4){

gloss="正常光泽倾向";

}

else{

gloss="亚光或结晶倾向";

}




// 透明度判断


if(al2o3<0.35 && ratio>5){

transparency="透明度较高";

}

else if(al2o3<0.55){

transparency="半透明倾向";

}

else{

transparency="乳浊或半哑倾向";

}




// 流动性判断


if(base>1.2 && al2o3<0.4){

flow="熔融强，流动风险较高";

}

else if(al2o3>0.6){

flow="稳定，流动性较低";

}

else{

flow="中等流动性";

}




// 风险判断


if(base>1.3){

risk="熔剂比例偏高，注意流釉";

}

else if(al2o3<0.25){

risk="氧化铝不足，釉稳定性较低";

}

else{

risk="基础稳定";

}


let html="";



html+=`

<p class="ok">

✔ 配方比例正确：100%

</p>



<h3>

Seger Formula

</h3>

`;





["RO","R2O","R2O3","RO2"].forEach(group=>{


html+=`

<h4>

${group}

</h4>

`;



oxides

.filter(o=>o.group===group)

.forEach(o=>{


if(seger[o.oxide]){


html+=`

<div class="item">

<span>

${o.oxide}

</span>


<span>

${seger[o.oxide].toFixed(3)}

</span>


</div>

`;

}


});


});





html+=`

<h3>

关键比例

</h3>


SiO₂ / Al₂O₃：

${ratio.toFixed(2)}

<br>


Al₂O₃ / RO：

${al2o3.toFixed(3)}



<h3>

釉性预测

</h3>



<div class="tag">

${temperature}

</div>


<div class="tag">

${gloss}

</div>


<div class="tag">

${transparency}

</div>


<div class="tag">

${flow}

</div>



<h3>

风险提示

</h3>


${risk}



<h3>

原料氧化物总量

</h3>

`;





for(let oxide in oxideWeight){


html+=`

<div class="item">

<span>${oxide}</span>

<span>${oxideWeight[oxide].toFixed(3)}</span>

</div>

`;

}





html+=`

<p>

说明：

本计算基于标准化原料氧化物分析值。

实际烧成效果会受到：

<br>

胎体组成

<br>

施釉厚度

<br>

烧成气氛

<br>

保温时间

<br>

冷却速度

<br>

等因素影响。

</p>

`;





document

.getElementById("result")

.innerHTML=html;



}


</script>


</body>


</html>
