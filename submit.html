<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>守艺人 · 提交釉方</title>


<style>

body{

font-family:Arial,sans-serif;

max-width:700px;

margin:auto;

padding:20px;

background:#f5f2eb;

}


h1{

text-align:center;

color:#5c4033;

}



.card{

background:white;

padding:25px;

border-radius:12px;

}



label{

display:block;

margin-top:15px;

}



input,textarea,select{

width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ccc;

border-radius:8px;

box-sizing:border-box;

}



textarea{

height:120px;

}



button{

margin-top:20px;

padding:12px 25px;

border:none;

border-radius:20px;

background:#8b6f47;

color:white;

cursor:pointer;

}


.back{

margin-bottom:20px;

}


a{

color:#5c4033;

text-decoration:none;

}


</style>


</head>


<body>



<div class="back">

<a href="index.html">

← 返回釉库

</a>

</div>




<div class="card">


<h1>

提交你的釉方

</h1>



<form action="https://formsubmit.co/lqydf123@gmail.com" method="POST">


<label>

釉方名称

<input

name="name"

required>

</label>




<label>

分类

<select name="category">

<option>青釉</option>

<option>黑釉</option>

<option>白釉</option>

<option>天目釉</option>

<option>灰釉</option>

<option>其他</option>

</select>

</label>




<label>

烧成温度

<input

name="temperature"

placeholder="例如：1280℃">

</label>




<label>

烧成气氛

<input

name="atmosphere"

placeholder="例如：还原焰">

</label>




<label>

釉方配比

<textarea

name="ingredients"

placeholder="填写原料比例">

</textarea>

</label>




<label>

制作经验

<textarea

name="notes"

placeholder="分享你的烧制经验">

</textarea>

</label>




<label>

提交人

<input

name="author"

placeholder="可填写昵称">

</label>




<button type="submit">

提交釉方

</button>



</form>



</div>



</body>


</html>
